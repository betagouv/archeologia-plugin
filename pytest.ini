[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --ignore=__init__.py -rs
norecursedirs = .git __pycache__ .pytest_cache src/ui
# Les dossiers tmp_path des tests verts sont effacés en fin de série (≈ 4 Go par série sinon, trois séries gardées).
tmp_path_retention_policy = failed
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
